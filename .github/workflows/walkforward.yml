# Playbook v3 前推對帳 — 每日模擬記帳 (walkforward/)
# 排程注意: 兩班都在台北午夜前 (21:07 主班 / 23:07 兜底)。GitHub cron 會延遲, 若延遲跨
# 台北午夜, 腳本以「hour<12 回推一天」決定目標日, 不會滾成隔日
# (同 taiwan-flows target_trading_day; taiwan-stock-news 2026-07-16 事故的教訓)。
# 延遲實測 (2026-09-07, 本帳號 taiwan-flows/postmkt/taiwan-flow-live-v2 三 repo 共 120 筆
# event:schedule run, created_at 減 cron 排定時刻): 中位數 3h02m / p90 6h09m / 最大 9h45m;
# >2h 佔 66.7%, >4h 佔 26.7%, >10h 為 0 筆; 分月中位數 07 月 2h03m -> 08 月 2h13m ->
# 09 月 3h21m (延遲在惡化)。本檔原寫「常態延遲 1~2 小時」與實測不符, 2026-09-07 依上表更正。
# index.html 的 ledgerStatus() 與跨站判級 (taiwan-flow-live-v2 Worker gradeBacktest、
# claude-harness freshness_watchdog.judge_backtest) 的「資料缺漏」紅線即依此表定為
# 主班+10 小時 (參考時鐘 19:07): 實測 120 筆無一超過, 且距腳本硬期限 (target=(now-12h),
# 主班+14h53m 後參考日滾成隔天而永久漏記) 仍有近 5 小時餘裕。
# 腳本冪等: 同日已記帳即跳過; tick 未落地則本班放棄、由下一班或隔日補。
name: walkforward
on:
  schedule:
    - cron: "7 13 * * 1-5"   # 台北 21:07 主班
    - cron: "7 15 * * 1-5"   # 台北 23:07 兜底
  workflow_dispatch:

permissions:
  contents: write
  issues: write    # 失敗告警開 issue 用

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet pandas requests
      - name: 記帳
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python walkforward/walkforward_daily.py
      - name: Commit & push
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add walkforward/ledger.csv
          if git diff --staged --quiet; then
            echo "無新記帳, 不 commit"; exit 0
          fi
          git commit -m "walkforward ledger $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase && sleep $((i*3))
          done
          exit 1

      # 影子對照帳冊(1R保本 / 1R保本+時間停損): 規格 walkforward/SHADOW-SPEC.md。
      # 刻意排在正式帳冊 commit 之後 —— 影子失敗不影響正式落帳, 但仍觸發告警。
      - name: 影子記帳
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python walkforward/shadow_daily.py
      - name: Commit shadow
        run: |
          cd "$GITHUB_WORKSPACE"
          # 影子 CSV 首日(2026-09-07)之前尚不存在, git add 不存在的路徑會 exit 128
          for f in walkforward/ledger_shadow_1rbe.csv walkforward/ledger_shadow_1rbe_ts.csv; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "無新影子記帳, 不 commit"; exit 0
          fi
          git commit -m "walkforward shadow ledgers $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase && sleep $((i*3))
          done
          exit 1

      - name: Notify failure
        # cancelled 也要告警：跑一半被取消（GitHub 端異常或誤按）同樣代表該場沒產出，
        # 而 failure() 在 cancelled 時不成立（2026-07-24 postmkt pm 場靜默消失的教訓）
        if: failure() || cancelled()
        uses: ./.github/actions/notify-failure
        with:
          pipeline: v2-walkforward
